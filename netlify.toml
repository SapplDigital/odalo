[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  SITE_URL = "https://odalo.sappl-digital-services.com"
  SITE_BASE = "/"
  PUBLIC_NOINDEX = "true"
  PUBLIC_AUDIT_TRANSPORT = "netlify"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'"
    Strict-Transport-Security = "max-age=31536000"

[[redirects]]
  from = "https://odalo.sappl-digital.de/*"
  to = "https://odalo.sappl-digital-services.com/:splat"
  status = 301
  force = true
