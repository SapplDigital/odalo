<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Tidewell concept creative, portrait 1080x1350</title>
<style>
  :root { --ink: #1f3a5c; --mist: #e9eff5; --accent: #0b7f73; --head: Bahnschrift, "Segoe UI Semibold", "Segoe UI", sans-serif; --body: "Segoe UI", system-ui, sans-serif; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; background: var(--mist); color: var(--ink); font-family: var(--body); }
  .ad { width: 1080px; height: 1350px; display: grid; grid-template-rows: 450px 580px 320px; }
  .top { padding: 64px 72px 0; }
  .brand { display: inline-flex; align-items: center; gap: 14px; font: 600 40px/1 var(--head); letter-spacing: 0.01em; }
  .brand i { width: 24px; height: 24px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 7px #cfdcea; }
  h1 { margin-top: 44px; font: 600 96px/1 var(--head); letter-spacing: -0.02em; }
  h1 span { color: var(--accent); }
  .pic { position: relative; overflow: hidden; margin: 0 72px; border-radius: 6px; background: #dbe5ee; }
  .pic img { width: 100%; height: 100%; object-fit: cover; object-position: 56% center; display: block; }
  .base { padding: 40px 72px 0; display: grid; grid-template-columns: 1fr; align-content: start; gap: 18px; }
  .sub { font: 500 38px/1.25 var(--body); max-width: 860px; }
  .row { display: flex; align-items: center; gap: 28px; margin-top: 12px; }
  .cta { font: 600 44px/1 var(--head); background: var(--accent); color: #fff; padding: 20px 32px; border-radius: 6px; white-space: nowrap; }
  .url { font: 600 32px/1.1 var(--body); }
  .label { font: 500 22px/1.2 var(--body); color: #36506b; margin-top: 10px; }
</style></head>
<body>
<main class="ad">
  <div class="top">
    <div class="brand"><i></i>Tidewell</div>
    <h1>Back. Knees.<br>Shoulders.<br><span>Weekend sport.</span></h1>
  </div>
  <div class="pic"><img src="../assets/studio-scene.svg" alt="Illustration of a bright treatment studio with people doing gentle exercises"></div>
  <div class="base">
    <p class="sub">Physiotherapy for everyday movement, in Millbrook.</p>
    <div class="row"><span class="cta">Ask about a first visit</span><span class="url">tidewell.example/millbrook</span></div>
    <p class="label">Concept creative for a fictional practice. Not a published ad.</p>
  </div>
</main>
</body></html>
