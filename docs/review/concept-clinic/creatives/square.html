<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Tidewell concept creative, square 1080x1080</title>
<style>
  :root { --ink: #1f3a5c; --mist: #e9eff5; --paper: #f7f9fb; --accent: #0b7f73; --head: Bahnschrift, "Segoe UI Semibold", "Segoe UI", sans-serif; --body: "Segoe UI", system-ui, sans-serif; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1080px; height: 1080px; overflow: hidden; background: var(--paper); color: var(--ink); font-family: var(--body); }
  .ad { width: 1080px; height: 1080px; display: grid; grid-template-rows: 560px 360px 160px; }
  .top { padding: 64px 72px 0; position: relative; }
  .brand { display: inline-flex; align-items: center; gap: 14px; font: 600 40px/1 var(--head); letter-spacing: 0.01em; }
  .brand i { width: 24px; height: 24px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 7px #dbe5ee; }
  h1 { margin-top: 56px; font: 600 104px/0.98 var(--head); letter-spacing: -0.02em; max-width: 940px; }
  .pic { position: relative; overflow: hidden; background: var(--mist); }
  .pic img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 42%; display: block; }
  .bar { background: var(--ink); color: #fff; display: grid; grid-template-columns: 1fr auto; align-items: center; padding: 0 72px; row-gap: 6px; }
  .cta { grid-row: 1; justify-self: start; font: 600 44px/1 var(--head); background: var(--accent); padding: 20px 32px; border-radius: 6px; }
  .url { grid-row: 1; grid-column: 2; font: 600 34px/1 var(--body); color: #cfe0ee; }
  .label { grid-column: 1 / -1; font: 500 22px/1.2 var(--body); color: #b9cde0; margin-top: 12px; }
  .bar { align-content: center; }
</style></head>
<body>
<main class="ad">
  <div class="top">
    <div class="brand"><i></i>Tidewell</div>
    <h1>Physiotherapy, five minutes from Millbrook Market.</h1>
  </div>
  <div class="pic"><img src="../assets/street-scene.svg" alt="Illustration of the Tidewell Physiotherapy storefront on Millbrook Lane next to a bakery and a number 12 bus stop"></div>
  <div class="bar">
    <span class="cta">Ask about a first visit</span><span class="url">tidewell.example/millbrook</span>
    <span class="label">Concept creative for a fictional practice. Not a published ad.</span>
  </div>
</main>
</body></html>
