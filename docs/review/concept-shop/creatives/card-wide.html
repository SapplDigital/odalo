<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Brindle Pantry concept card, 1600x1000</title>
<link rel="stylesheet" href="common.css">
<style>
  html, body { width: 1600px; height: 1000px; background: var(--tomato); }
  .ad { position: relative; width: 1600px; height: 1000px; }
  .brand { position: absolute; left: 96px; top: 76px; font: 800 44px/1 var(--slab); letter-spacing: 6px; color: var(--paper); }
  h1 { position: absolute; left: 96px; top: 190px; font: 800 140px/1 var(--slab); color: var(--paper); letter-spacing: -1px; }
  .sub { position: absolute; left: 100px; top: 520px; font: 600 50px/1.2 var(--body); color: var(--paper); max-width: 520px; }
  .label { position: absolute; left: 100px; bottom: 56px; font: 500 26px/1.2 var(--body); color: var(--paper); opacity: 0.9; }
  #art { position: absolute; left: 0; top: 0; }
</style></head>
<body><main class="ad">
  <svg id="art" width="1600" height="1000" viewBox="0 0 1600 1000" aria-hidden="true"></svg>
  <div class="brand">BRINDLE PANTRY</div>
  <h1>Small<br>batches.</h1>
  <p class="sub">Jams, salts, oils and crackers.</p>
  <div class="label">Concept creative for a fictional shop. Not a published ad.</div>
</main>
<script src="../shop-art.js"></script>
<script>
  var A = window.ShopArt, h = '';
  h += '<circle cx="1180" cy="560" r="400" fill="#f7b32b"/>';
  h += '<rect x="700" y="800" width="860" height="40" rx="5" fill="#b98a56"/><rect x="700" y="800" width="860" height="10" rx="5" fill="#8d6439"/>';
  [['jam', 815], ['salt', 1004], ['oil', 1153], ['crackers', 1311], ['honey', 1502]].forEach(function (p) { h += '<g transform="translate(' + p[1] + ' 800) scale(1.15)">' + A.products[p[0]]() + '</g>'; });
  h += '<g transform="translate(1130 190) rotate(16) scale(1.4)">' + A.ingredients.lemon + '</g><g transform="translate(1450 300) rotate(-24) scale(1.3)">' + A.ingredients.plum + '</g>';
  document.getElementById('art').innerHTML = h;
</script></body></html>
