<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Brindle Pantry concept creative, square 1080x1080</title>
<link rel="stylesheet" href="common.css">
<style>
  html, body { width: 1080px; height: 1080px; background: var(--mustard); }
  .ad { position: relative; width: 1080px; height: 1080px; }
  .brand { position: absolute; left: 72px; top: 60px; font: 800 38px/1 var(--slab); letter-spacing: 5px; }
  h1 { position: absolute; left: 72px; top: 130px; font: 800 150px/0.98 var(--slab); letter-spacing: -1px; }
  h1 span { color: var(--tomato); } .sub { z-index: 2; }
  .sub { position: absolute; left: 76px; top: 432px; font: 600 44px/1.2 var(--body); max-width: 560px; }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 150px; background: var(--ink); color: var(--paper); padding: 28px 72px 0; }
  .bar b { display: block; font: 600 40px/1.15 var(--body); }
  .bar b i { color: var(--mustard); font-style: normal; }
  .bar small { display: block; margin-top: 12px; font: 500 22px/1.2 var(--body); color: #c8d2cd; }
  #art { position: absolute; left: 0; top: 0; }
</style></head>
<body><main class="ad">
  <svg id="art" width="1080" height="1080" viewBox="0 0 1080 1080" aria-hidden="true"></svg>
  <div class="brand">BRINDLE PANTRY</div>
  <h1>Fill a<br><span>basket.</span></h1>
  <p class="sub">Jams, salts, oils and crackers on the shelf.</p>
  <div class="bar"><b>Tuesday to Saturday, 9 to 5 &middot; <i>brindle.example</i></b><small>Concept creative for a fictional shop. Not a published ad.</small></div>
</main>
<script src="../shop-art.js"></script>
<script>
  var A = window.ShopArt, svg = document.getElementById('art'), h = '';
  h += '<circle cx="940" cy="330" r="190" fill="#f2542d"/>';
  h += '<g transform="translate(940 330) rotate(14) scale(1.9)">' + A.ingredients.lemon + '</g>';
  h += '<g transform="translate(790 590) rotate(-20) scale(1.35)">' + A.ingredients.plum + '</g>';
  h += '<g transform="translate(1000 560) rotate(30) scale(1.2)">' + A.ingredients.chilli + '</g>';
  h += '<rect x="40" y="880" width="1000" height="34" rx="4" fill="#b98a56"/><rect x="40" y="880" width="1000" height="9" rx="4" fill="#8d6439"/>';
  [['jam', 150], ['salt', 345], ['oil', 500], ['crackers', 690], ['honey', 910]].forEach(function (p) { h += '<g transform="translate(' + p[1] + ' 880) scale(1.12)">' + A.products[p[0]]() + '</g>'; });
  svg.innerHTML = h;
</script></body></html>
